name: Verify and Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Verify extension identities
        run: npm run check:identities

      - name: Unit tests
        run: npm test

      - name: Build Chrome and Firefox
        run: npm run build:all

      - name: Enforce lazy bundle budgets
        run: npm run check:bundle-sizes

      - name: Upload browser bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aniwebscale-browser-development-bundles
          path: |
            dist-chrome
            dist-firefox

  browser-e2e:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned browsers
        run: npm run test:e2e:install

      - name: Chrome extension E2E
        env:
          ANIME4K_REQUIRE_E2E_CAPABILITIES: "1"
        run: npm run test:e2e:chrome

      - name: Firefox extension E2E
        run: npm run test:e2e:firefox

  native-windows:
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Verify generated native models
        run: python native/tools/generate_anime4k_models.py --check

      - name: Native generator unit tests
        run: python -m unittest discover -s native/tools/tests -v

      - name: Build and test the Windows native renderer
        shell: powershell
        run: ./native/scripts/build.ps1 -BuildDirectory native/build-ci -Configuration Release

      - name: Upload tested native payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aniwebscale-native-windows-x64
          path: native/build-ci/bin/Release
          if-no-files-found: error
