name: Live availability monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aniwebscale-live-monitor
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - name: Check public deployment
        env:
          LIVE_BASE_URL: ${{ vars.ANIWEBSCALE_PUBLIC_URL }}
          LIVE_REQUIRE_LEGAL_APPROVAL: "1"
          LIVE_REQUIRE_SCHEMA_STATUS: "1"
          OPERATIONS_MONITOR_TOKEN: ${{ secrets.OPERATIONS_MONITOR_TOKEN }}
        run: npm run check:live
