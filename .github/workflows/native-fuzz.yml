name: Native protocol fuzz

on:
  schedule:
    - cron: '11 3 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aniwebscale-native-protocol-fuzz
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: windows-2022
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        seed: ['0xA41B40B5', '0xC0FFEE42', '0xDEADBEEF']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build native test targets
        shell: powershell
        run: ./native/scripts/build.ps1 -BuildDirectory native/build-fuzz -Configuration Release
      - name: Run deterministic protocol fuzz budget
        shell: powershell
        env:
          ANIME4K_FUZZ_SEED: ${{ matrix.seed }}
          ANIME4K_FUZZ_ITERATIONS: '250000'
        run: ./native/build-fuzz/Release/anime4k_protocol_fuzz_tests.exe
