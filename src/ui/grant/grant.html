<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AniWebScale - player access</title>
</head>
<body>
  <main class="grant-wrap">
    <div class="card">
      <div class="brand"><img class="mini-mark" src="icons/icon32.png" alt="" width="26" height="26">AniWebScale</div>
      <h1 data-i18n="grantTitle">Enable this video player</h1>
      <p class="lead"><span data-i18n="grantLeadBefore">This site embeds its video player from</span> <strong id="host">another website</strong><span data-i18n="grantLeadAfter">. Grant AniWebScale access to that player so it can enhance the video in fullscreen.</span></p>
      <div class="action-row">
        <button id="grant" type="button" disabled data-i18n="grantAction">Grant access</button>
        <div id="status" role="status" aria-live="polite"></div>
      </div>
      <p class="fine" data-i18n="grantFine">The grant covers this player domain only. You can revoke it anytime from the extension popup.</p>
    </div>
  </main>
</body>
</html>
