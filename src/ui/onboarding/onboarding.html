<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set up AniWebScale</title>
</head>
<body>
  <main>
    <div class="setup-panel">
      <header>
        <div class="brand"><img class="mini-mark" src="icons/icon32.png" alt="" width="26" height="26">AniWebScale</div>
        <h1 data-i18n="onboardingTitle">Sharper anime, in real time.</h1>
      </header>

      <section>
        <div class="section-heading"><h2 data-i18n="chooseDefaults">Choose your defaults</h2></div>
        <div id="enhancement-controls" class="grid"></div>
        <div id="enhancement-toggles"></div>
      </section>

      <section class="feature-section">
        <div class="section-heading"><h2 data-i18n="language">Language</h2></div>
        <label class="theme-field"><span data-i18n="language">Language</span><select id="language"><option value="auto" data-i18n="languageAuto">Auto (browser language)</option><option value="en">English</option><option value="de">Deutsch</option></select></label>
      </section>

      <section class="theme-section">
        <div class="section-heading"><h2 data-i18n="colorTheme">Color theme</h2></div>
        <label class="theme-field"><span data-i18n="theme">Theme</span><select id="theme"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
      </section>

      <div class="finish-row">
        <button id="finish" type="button"><span data-i18n="finishSetup">Finish setup</span> <span aria-hidden="true">&#8594;</span></button>
        <div id="status" role="status" aria-live="polite"></div>
      </div>
    </div>
  </main>
</body>
</html>
