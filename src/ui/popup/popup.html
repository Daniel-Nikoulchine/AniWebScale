<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AniWebScale</title>
  </head>
  <body>
    <main class="panel">
      <header class="brand-header">
        <div class="brand-mark" aria-hidden="true">
          <img src="icons/icon48.png" alt="" width="48" height="48" />
        </div>
        <div class="brand-copy">
          <h1>AniWebScale</h1>
        </div>
      </header>

      <section
        id="extension-toggle"
        class="switch-card extension-switch-card"
        aria-label="Extension status"
      ></section>

      <section
        id="site-access-card"
        class="site-access-card"
        data-state="unavailable"
        aria-labelledby="site-access-title"
      >
        <div>
          <strong id="site-access-title" data-i18n="websiteAccess"
            >Website access</strong
          >
          <small id="site-access-summary"
            >Checking access for this site...</small
          >
        </div>
        <button id="site-access" class="secondary" type="button" disabled>
          Checking...
        </button>
      </section>

      <section class="settings-card">
        <div id="enhancement-controls" class="grid compact-fields"></div>
        <p
          id="mode-description"
          class="mode-description"
          aria-live="polite"
        ></p>

      </section>

      <section id="enhancement-toggles" class="switch-card" aria-label="Enhancement options"></section>

      <p
        id="native-warning"
        class="hint native-warning"
        style="display: none"
      >
        <span aria-hidden="true">!</span
        ><span
          ><strong>Streaming video stays black?</strong> Turn off hardware
          acceleration in your browser settings, then restart the browser.</span
        >
      </p>

      <div class="actions">
        <button id="open-options" class="secondary">
          <span data-i18n="advancedSettings">Advanced settings</span>
          <span aria-hidden="true">&#8594;</span>
        </button>
      </div>
      <div id="status" role="status" aria-live="polite"></div>
    </main>
    <footer><span>AniWebScale</span><i></i><span id="version"></span></footer>
  </body>
</html>
