<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AniWebScale</title>
</head>
<body>
  <main class="panel">
    <header class="brand-header">
      <div class="brand-mark" aria-hidden="true"><img src="icons/icon48.png" alt="" width="46" height="46"></div>
      <div class="brand-copy">
        <h1>AniWebScale~!!</h1>
        <p>Real-time video enhancement</p>
      </div>
    </header>

    <button id="account-plan" class="account-plan" type="button"><span>Plan</span><strong>Free</strong><small>Manage account</small></button>

    <section class="switch-card extension-switch-card" aria-label="Extension status">
      <label class="check-row"><input id="extension-enabled" type="checkbox"><span class="check-control"></span><span><strong>Extension enabled</strong><small>Process videos in this browser</small></span></label>
    </section>

    <section class="settings-card" aria-labelledby="quick-setup-title">
      <div class="section-heading">
        <span class="heading-icon lavender" aria-hidden="true">&#10022;</span>
        <div><h2 id="quick-setup-title">Quick setup</h2></div>
      </div>

      <label class="mode-select-field">
          <span>Enhancement mode</span>
          <select id="mode">
            <option value="OFF">Off</option>
            <optgroup label="Anime4K presets">
              <option value="A">A</option><option value="B">B</option><option value="C">C</option>
              <option value="AA">A+A</option><option value="BB">B+B</option><option value="CA">C+A</option>
            </optgroup>
            <optgroup label="AI upscaling">
              <option value="CNNX2">CNN Upscale x2</option><option value="ARTCNN">ArtCNN C4F16 x2 (GLSL)</option><option value="ACNET">ACNet F8B4 x2 (GLSL)</option><option value="ARNET">ARNet F8B8 x2 (GLSL)</option><option value="ANIMEJANAI">AnimeJaNai HD x2 (Performance)</option>
            </optgroup>
          </select>
      </label>
      <p id="mode-description" class="mode-description" aria-live="polite"></p>
      <div class="grid compact-fields">
        <label>
          <span>Quality</span>
          <select id="quality"><option value="M">Medium (M)</option><option value="VL">Very Large (VL)</option><option value="UL">Ultra Large (UL)</option></select>
        </label>
        <label><span>Backend</span><select id="backend"><option value="auto">Auto</option><option value="webgpu">WebGPU (hardware acceleration required)</option><option value="native">Native Windows renderer</option></select></label>
      </div>
    </section>

    <section class="switch-card" aria-label="Enhancement options">
      <label class="check-row"><input id="frame-generation" type="checkbox"><span class="check-control"></span><span><strong>Frame generation</strong><small>Motion-aware 2x</small></span></label>
      <label class="check-row"><input id="auto-fullscreen" type="checkbox"><span class="check-control"></span><span><strong>Auto fullscreen</strong><small>Enhance when a player expands</small></span></label>
      <label class="check-row"><input id="statistics" type="checkbox"><span class="check-control"></span><span><strong>Live statistics</strong><small>FPS, timing and dropped frames</small></span></label>
    </section>

    <p class="hint native-warning"><span aria-hidden="true">!</span><span><strong>Streaming video stays black?</strong> Turn off hardware acceleration in your browser settings, then restart the browser.</span></p>

    <div class="actions">
      <button id="save" class="primary">Save &amp; apply <span aria-hidden="true">&#10022;</span></button>
      <button id="open-options" class="secondary">Advanced settings <span aria-hidden="true">&#8594;</span></button>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
  </main>
  <footer><span>AniWebScale</span><i></i><span id="version"></span></footer>
</body>
</html>
