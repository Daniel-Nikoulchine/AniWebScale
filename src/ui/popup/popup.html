<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AniWebScale</title>
  </head>
  <body>
    <main class="panel">
      <header class="brand-header">
        <div class="brand-mark" aria-hidden="true">
          <img src="icons/icon48.png" alt="" width="48" height="48" />
        </div>
        <div class="brand-copy">
          <h1>AniWebScale</h1>
        </div>
        <button
          id="open-options"
          class="gear-button"
          type="button"
          aria-label="Advanced settings"
          data-i18n-aria-label="advancedSettings"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
        </button>
      </header>

      <section
        id="extension-toggle"
        class="switch-card extension-switch-card"
        aria-label="Extension status"
      ></section>

      <section
        id="site-access-card"
        class="site-access-card"
        data-state="unavailable"
        aria-labelledby="site-access-title"
      >
        <div>
          <strong id="site-access-title" data-i18n="websiteAccess"
            >Website access</strong
          >
          <small id="site-access-summary"
            >Checking access for this site...</small
          >
        </div>
        <button id="site-access" class="secondary" type="button" disabled data-i18n="statusChecking">
          Checking...
        </button>
      </section>

      <section class="settings-card">
        <div id="enhancement-controls" class="grid compact-fields"></div>
        <p
          id="mode-description"
          class="mode-description"
          aria-live="polite"
        ></p>

      </section>

      <section id="enhancement-toggles" class="switch-card" aria-label="Enhancement options"></section>

      <p
        id="native-warning"
        class="hint native-warning"
        style="display: none"
      >
        <span aria-hidden="true">!</span
        ><span
          ><strong>Streaming video stays black?</strong> Turn off hardware
          acceleration in your browser settings, then restart the browser.</span
        >
      </p>

      <div id="status" role="status" aria-live="polite"></div>
    </main>
    <footer><span id="version"></span></footer>
  </body>
</html>
